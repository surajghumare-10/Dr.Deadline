services:
  - type: web
    name: dr-deadline-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python3 -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  - type: web
    name: dr-deadline-app
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dr-deadline-api
          property: host
